name: GlowRoad
description: 'GlowRoad is an Indian social-commerce and reselling platform, headquartered in Bengaluru
  and founded in 2017, that enabled individuals — predominantly home-based women entrepreneurs — to resell
  fashion, home, and lifestyle products to their social networks over WhatsApp and Facebook without holding
  inventory. The company was acquired by Amazon India in 2021 and its reselling model was subsequently
  folded into Amazon''s operations. GlowRoad runs a consumer mobile app and a supplier-onboarding funnel
  rather than a public developer program; as of this enrichment pass no developer portal, API documentation,
  OpenAPI, or partner API surface is published, and the public web endpoints return HTTP 503.'
